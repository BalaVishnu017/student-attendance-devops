
apiVersion: apps/v1
kind: Deployment
metadata:
  name: attendance-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attendance
  template:
    metadata:
      labels:
        app: attendance
    spec:
      containers:
        - name: attendance
          image: student-attendance:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: attendance-storage
              mountPath: /app/data
      volumes:
        - name: attendance-storage
          persistentVolumeClaim:
            claimName: attendance-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: attendance-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: attendance-service
spec:
  type: NodePort
  selector:
    app: attendance
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
